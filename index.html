<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Centralised maintenance and complaint management system for Rajalakshmi Institute of Technology (College and Hostel facilities)." />
  <meta name="theme-color" content="#123d70" />
  <title>RIT Maintenance Tracker</title>

  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <!--
    index.html is only the shell. Every screen is rendered by JavaScript into #app.
    This keeps markup small and lets each role have its own module.
  -->

  <!-- Boot screen: shown while Firebase loads and the session is being restored -->
  <div id="boot" class="boot">
    <div class="boot__card">
      <div class="spinner"></div>
      <h1 class="boot__title">RIT Maintenance Tracker</h1>
      <p id="bootText" class="muted">Starting up…</p>
    </div>
  </div>

  <!-- Everything the app renders goes here -->
  <div id="app" hidden></div>

  <!-- Global UI surfaces -->
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="modalRoot" class="modal-root" hidden></div>
  <div id="loader" class="loader-overlay" hidden aria-label="Loading">
    <div class="loader-overlay__box">
      <div class="spinner"></div>
      <span id="loaderText">Working…</span>
    </div>
  </div>

  <noscript>
    <div style="padding:24px;font-family:Arial,sans-serif">
      This application requires JavaScript. Please enable JavaScript in your browser.
    </div>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
